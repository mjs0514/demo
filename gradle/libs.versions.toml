[versions]
spring-boot = "3.5.16"
spring-dependency-management = "1.1.7"

# Tools
lombok = "1.18.46"

# Utils
fabric8 = "7.6.1"

# Test
junit5 = "5.10.2"
assertj = "3.25.3"


[libraries]
spring-boot-gradle-plugin = { module = "org.springframework.boot:spring-boot-gradle-plugin", version.ref = "spring-boot" }
spring-dependency-management-gradle-plugin = { module = "io.spring.dependency-management:io.spring.dependency-management.gradle.plugin", version.ref = "spring-dependency-management" }

spring-boot-dependencies = { module = "org.springframework.boot:spring-boot-dependencies", version.ref = "spring-boot" }
spring-boot-starter = { module = "org.springframework.boot:spring-boot-starter" }
spring-boot-starter-web = { module = "org.springframework.boot:spring-boot-starter-web" }
spring-boot-starter-test = { module = "org.springframework.boot:spring-boot-starter-test" }
spring-boot-starter-autoconfigure = { module = "org.springframework.boot:spring-boot-autoconfigure"}
spring-boot-configuration-processor = { module = "org.springframework.boot:spring-boot-configuration-processor"}
spring-boot-autoconfigure-processor = { module = "org.springframework.boot:spring-boot-autoconfigure-processor"}

fabric8-kubernetes-client = { module = "io.fabric8:kubernetes-client", version.ref = "fabric8" }

lombok = {module = "org.projectlombok:lombok", version.ref = "lombok"}

junit-bom = {module = "org.junit:junit-bom", version.ref="junit5"}
junit-jupiter = {module = "org.junit.jupiter:junit-jupiter"}
junit-platform-launcher = {module = "org.junit.platform:junit-platform-launcher"}
assertj-core = {module = "org.assertj:assertj-core", version.ref="assertj"}

[plugins]
spring-dependency-management = { id = "io.spring.dependency-management", version.ref = "spring-dependency-management" }